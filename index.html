<meta charset="UTF-8">

<title>@vampireeditor</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
  }

  .logo {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(260px, 60vw);
    aspect-ratio: 701 / 277;
    -webkit-mask-image: url("images/vampire-editor-logo.png");
    mask-image: url("images/vampire-editor-logo.png");
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    background-color: #f2f2f2;
    animation: logoBlink 1.2s steps(1, end) infinite;
  }

  @keyframes logoBlink {
    0%   { background-color: #f2f2f2; }
    25%  { background-color: #b23b30; }
    50%  { background-color: #999999; }
    75%  { background-color: #f2f2f2; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo {
      animation: none;
      background-color: #f2f2f2;
    }
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: normal;
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    color: #eee;
    letter-spacing: 0.02em;
    margin: 0 0 14px;
  }

  p {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    color: #888;
    margin: 0 0 44px;
  }

  .icons {
    display: flex;
    gap: 28px;
    align-items: center;
  }

  .icons a {
    color: #888;
    display: inline-flex;
    transition: color 0.2s ease;
  }

  .icons a:hover {
    color: #eee;
  }

  .icons svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }
</style>
</head>
